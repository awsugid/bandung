name: Sync Meetup events

on:
  schedule:
    # Every Monday at 07:00 WIB (00:00 UTC).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-meetup-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2

      - name: Sync events from the Meetup feed
        run: bun scripts/sync-meetup-events.ts

      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/data/meetup-events.json; then
            echo "No new or changed events."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/meetup-events.json
          git commit -m "chore: sync meetup events"
          git push origin HEAD:main
